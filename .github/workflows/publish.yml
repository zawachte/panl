name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@v4.3.0
      - name: Validate release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(helm show chart deploy/helm/panl | awk '/^version:/ {print $2}')" = "$VERSION"
          test "$(helm show chart deploy/helm/panl | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}')" = "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: go test -race ./... && go vet ./...
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: helm lint deploy/helm/panl
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/zawachte/panl:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/zawachte/panl
            org.opencontainers.image.description=Agent-configured PromQL dashboards for Kubernetes
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/panl --destination artifacts
          helm push "artifacts/panl-$VERSION.tgz" oci://ghcr.io/zawachte/charts
          helm pull oci://ghcr.io/zawachte/charts/panl --version "$VERSION" --destination /tmp
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: artifacts/panl-*.tgz
