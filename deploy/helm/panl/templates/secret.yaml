{{- if and (not .Values.readOnly) (not .Values.agent.existingSecret) }}
{{- $name := include "panl.agentSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "panl.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data $existing.data.token }}
  token: {{ $existing.data.token | quote }}
  {{- else }}
  token: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
